{% extends "base.html" %}
{% block title %}Join Avonent OS{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-card">
    <p class="eyebrow">TEAM INVITE</p>
    <h1>Join Avonent OS</h1>
    <p>You were invited as <strong>{{ invite.role }}</strong> using <strong>{{ invite.email }}</strong>.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/join/{{ invite_token }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Name<input name="display_name" autocomplete="name" required></label>
      <label>Password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label>
      <label>Confirm password<input type="password" name="password_confirm" autocomplete="new-password" minlength="12" required></label>
      <button type="submit">Create account</button>
    </form>
  </section>
</main>
{% endblock %}
