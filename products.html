<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products · Avonent OS</title><link rel="stylesheet" href="static/pages.css">
</head>
<body data-page="products">
<header class="topbar">
  <a class="logo" href="index.html">AVONENT OS</a>
  <nav><a href="index.html">Home</a><a href="brands.html">Brands</a><a class="active" href="products.html">Products</a><a href="plans.html">Plans</a><a href="creatives.html">Creatives</a></nav>
</header>
<main>
  <section class="page-title"><p class="eyebrow">CATALOG</p><h1>Products</h1><p class="sub">Track products before we connect Shopify.</p></section>
  <section class="panel">
    <h2>Add product</h2>
    <form id="product-form" class="form-grid">
      <label>Brand<select id="product-brand" required></select></label>
      <label>Product name<input id="product-name" required></label>
      <label>Category<input id="product-category"></label>
      <label>Price<input id="product-price" type="number" step="0.01" min="0"></label>
      <label class="span-2">Notes<textarea id="product-notes"></textarea></label>
      <button type="submit">Add product</button>
    </form>
  </section>
  <section class="panel">
    <input id="product-search" class="search" type="search" placeholder="Search products, brands, category, notes">
    <div id="product-list" class="cards"></div>
  </section>
</main>
<script src="static/pages.js"></script>
</body>
</html>
