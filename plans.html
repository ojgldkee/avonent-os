<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Plans · Avonent OS</title><link rel="stylesheet" href="static/pages.css">
</head>
<body data-page="plans">
<header class="topbar">
  <a class="logo" href="index.html">AVONENT OS</a>
  <nav><a href="index.html">Home</a><a href="brands.html">Brands</a><a href="products.html">Products</a><a class="active" href="plans.html">Plans</a><a href="creatives.html">Creatives</a></nav>
</header>
<main>
  <section class="page-title"><p class="eyebrow">STRATEGY</p><h1>Plans</h1><p class="sub">Store marketing plans, product plans, testing plans and operating notes.</p></section>
  <section class="panel">
    <h2>Add plan</h2>
    <form id="plan-form" class="form-grid">
      <label>Title<input id="plan-title" required></label>
      <label>Type<select id="plan-type"><option>Marketing</option><option>Creative testing</option><option>Product research</option><option>Scaling</option><option>Operations</option><option>Other</option></select></label>
      <label class="span-2">Plan<textarea id="plan-body" class="tall" required placeholder="Write your plan here..."></textarea></label>
      <buttton type="submit">Save plan</button>
    </form>
  </section>
  <section class="panel">
    <input id="plan-search" class="search" type="search" placeholder="Search plans">
    <div id="plan-list" class="stack"></div>
  </section>
</main>
<script src="static/pages.js"></script>
</body>
</html>
