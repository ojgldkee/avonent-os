name: Avonent competitor research

on:
  push:
    paths:
      - '.github/workflows/competitor-research.yml'
      - 'services/meta-scraper/src/**'
  workflow_dispatch:
    inputs:
      competitor_id:
        description: Optional competitor_watchlist UUID; blank scans all active brands
        required: false
        type: string
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: competitor-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: services/meta-scraper

    env:
      SUPABASE_URL: https://rycaylyhgjgovyxwhgjg.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_API_KEY: github-actions-local
      COMPETITOR_ID: ${{ inputs.competitor_id }}

    steps:
      - name: Checkout Avonent
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local collector
        run: |
          node src/server.js > /tmp/avonent-scraper.log 2>&1 &
          echo $! > /tmp/avonent-scraper.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/avonent-scraper.log
          exit 1

      - name: Research tracked brands
        run: node src/github-runner.js

      - name: Install transcript engine
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "faster-whisper>=1.1,<2"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Transcribe captured video ads
        env:
          MAX_TRANSCRIPTS_PER_RUN: "8"
          WHISPER_MODEL: small.en
        run: python src/transcribe-videos.py

      - name: Analyze transcript and video structure
        run: |
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"limit":12}' \
            "$SUPABASE_URL/functions/v1/analyze-competitor-ads"

      - name: Print collector log on failure
        if: failure()
        run: cat /tmp/avonent-scraper.log || true
