<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#000000">
  <title>Account · Avonent Creative</title>
  <link rel="stylesheet" href="static/site.css?v=1">
</head>
<body data-page="auth">
<header class="topbar">
  <a class="logo" href="index.html">AVONENT</a>
  <nav class="nav">
    <a href="index.html">Dashboard</a>
    <a href="chat.html">Creative Chat</a>
    <a href="creatives.html">Library</a>\n    <a href="pipeline.html">Pipeline</a>\n    <a href="assets.html">Assets</a>
  </nav>
</header>

<main class="auth-main">
  <section class="auth-card">
    <p class="eyebrow">ACCOUNT</p>
    <h1 id="auth-title">Log in</h1>
    <p id="auth-subtitle" class="sub">Access your private creative workspace.</p>

    <div id="auth-message" class="notice hidden"></div>

    <form id="auth-form" class="form-stack">
      <label id="display-name-label" class="hidden">Name
        <input id="display-name" autocomplete="name" placeholder="Your name">
      </label>
      <label>Email
        <input id="auth-email" type="email" autocomplete="email" required placeholder="you@example.com">
      </label>
      <label>Password
        <input id="auth-password" type="password" autocomplete="current-password" minlength="8" required placeholder="At least 8 characters">
      </label>
      <button id="auth-submit" type="submit">Log in</button>
    </form>

    <p class="auth-switch">
      <span id="auth-switch-text">Need an account?</span>
      <a id="auth-switch-link" href="auth.html?mode=signup">Sign up</a>
    </p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="static/config.js?v=1"></script>
<script src="static/app.js?v=1"></script>
</body>
</html>
